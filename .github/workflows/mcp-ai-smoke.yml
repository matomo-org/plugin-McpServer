name: MCP AI Smoke

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      codex_model:
        description: Codex model
        required: false
        default: gpt-5-mini

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: mcp-ai-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: McpServer
  MATOMO_DIR: ${{ github.workspace }}/matomo
  BASE_URL: http://127.0.0.1:8000
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_DATABASE: matomo
  CODEX_MODEL: ${{ github.event.inputs.codex_model || 'gpt-5-mini' }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      has_codex: ${{ steps.check.outputs.has_codex }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - id: check
        name: Check secret availability
        env:
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
        run: |
          set -euo pipefail
          has_codex=false

          if [ -n "${OPENAI_APIKEY:-}" ]; then
            has_codex=true
          fi

          echo "has_codex=${has_codex}" >> "$GITHUB_OUTPUT"

          if [ "$has_codex" = false ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=No provider secret is available in this context (likely fork PR)." >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Ready to run smoke checks for one or more providers." >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight summary
        run: |
          {
            echo "## MCP AI Smoke Preflight"
            echo
            echo "- should_run: ${{ steps.check.outputs.should_run }}"
            echo "- Codex available: ${{ steps.check.outputs.has_codex }}"
            echo "- reason: ${{ steps.check.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke_codex:
    name: Codex smoke
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.has_codex == 'true'
    continue-on-error: true
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: matomo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.1'
          extensions: mbstring, mysqli

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check out github-action-tests repository
        uses: actions/checkout@v6
        with:
          repository: matomo-org/github-action-tests
          ref: main
          path: github-action-tests
          fetch-depth: 1
          persist-credentials: false

      - name: Check out Matomo for plugin builds
        run: ${{ github.workspace }}/github-action-tests/scripts/bash/checkout_matomo.sh
        env:
          PLUGIN_NAME: ${{ env.PLUGIN_NAME }}
          WORKSPACE: ${{ github.workspace }}
          ACTION_PATH: ${{ github.workspace }}/github-action-tests
          MATOMO_TEST_TARGET: maximum_supported_matomo

      - name: Prepare Matomo composer setup
        run: composer install --ignore-platform-reqs --no-interaction --no-progress
        working-directory: ${{ env.MATOMO_DIR }}

      - name: Setup Matomo with OmniFixture
        run: ./.github/scripts/mcp-smoke/setup-matomo-omnifixture.sh
        env:
          MATOMO_DIR: ${{ env.MATOMO_DIR }}
          BASE_URL: ${{ env.BASE_URL }}
          MYSQL_HOST: ${{ env.MYSQL_HOST }}
          MYSQL_PORT: ${{ env.MYSQL_PORT }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}

      # Intentionally install the latest release: this smoke job monitors CLI/MCP compatibility.
      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Codex MCP smoke suite
        run: ./.github/scripts/mcp-smoke/run-codex-smoke.sh
        env:
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          CODEX_MODEL: ${{ env.CODEX_MODEL }}
          BASE_URL: ${{ env.BASE_URL }}
          STATE_FILE: ${{ github.workspace }}/.github/scripts/mcp-smoke/.state.json
          CASES_FILE: ${{ github.workspace }}/.github/scripts/mcp-smoke/cases.json
          PROMPTS_DIR: ${{ github.workspace }}/.github/scripts/mcp-smoke/prompts
          ARTIFACT_DIR: ${{ github.workspace }}/.github/scripts/mcp-smoke/artifacts
          MATOMO_LOG_FILE: ${{ env.MATOMO_DIR }}/tmp/logs/matomo.log

      - name: Build Codex summary
        if: always()
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${{ github.workspace }}/.github/scripts/mcp-smoke/artifacts"
          RESULTS_FILE="$ARTIFACT_DIR/codex/results.json"
          {
            echo "## Codex Smoke"
            echo
            echo "- job result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$RESULTS_FILE" ]; then
            {
              echo
              echo "No results.json was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(jq 'length' "$RESULTS_FILE")
          passed=$(jq '[.[] | select(.status == "pass")] | length' "$RESULTS_FILE")
          skipped=$(jq '[.[] | select(.status == "skip")] | length' "$RESULTS_FILE")
          failed=$(jq '[.[] | select(.status == "fail")] | length' "$RESULTS_FILE")

          {
            echo
            echo "| Case | Expected Tool | Status | Reason |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.case_id) | \(.expected_tool) | \(.status) | \(.reason) |"' "$RESULTS_FILE"
            echo
            echo "- Total checks: ${total}"
            echo "- Passed: ${passed}"
            echo "- Skipped: ${skipped}"
            echo "- Failed: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Codex artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-ai-smoke-codex
          path: .github/scripts/mcp-smoke/artifacts/codex
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Final status
    runs-on: ubuntu-24.04
    needs: [preflight, smoke_codex]
    if: always()
    steps:
      - name: Final status summary
        run: |
          {
            echo "## MCP AI Smoke Result"
            echo
            echo "- preflight: ${{ needs.preflight.outputs.should_run }}"
            echo "- Codex available: ${{ needs.preflight.outputs.has_codex }}"
            echo "- reason: ${{ needs.preflight.outputs.reason }}"
            echo "- Codex job result: ${{ needs.smoke_codex.result || 'skipped' }}"
            echo
            echo "Prototype smoke is intentionally non-blocking."
          } >> "$GITHUB_STEP_SUMMARY"
