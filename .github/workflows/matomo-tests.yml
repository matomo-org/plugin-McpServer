# Action for running tests
# This file has been automatically created.
# To recreate it you can run this command
# ./console generate:test-action --plugin="McpServer" --php-versions="8.1,matomo5_max_php" --schedule-cron="0 5 * * 6"

name: Plugin McpServer Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 6'

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin_tests:
    name: Plugin McpServer Tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - matomo5_max_php
        target:
          - minimum_required_matomo
          - maximum_supported_matomo

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Run tests
        uses: matomo-org/github-action-tests@main
        with:
          plugin-name: McpServer
          php-version: ${{ matrix.php }}
          test-type: PluginTests
          matomo-test-branch: ${{ matrix.target }}

  ui:
    name: Plugin McpServer UI Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Run UI tests
        uses: matomo-org/github-action-tests@main
        with:
          plugin-name: McpServer
          matomo-test-branch: maximum_supported_matomo
          test-type: UI
          php-version: matomo5_max_php
          node-version: '16'
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: true
