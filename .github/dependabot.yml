version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: 5.x-dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: deps(composer)
    groups:
      composer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: 5.x-dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps(actions)
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
